<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Tab Messaging Example</title>
</head>
<body>
    <h1>Custom Tab Messaging Example</h1>
    <button id="sendMessageBtn">Send Message to Android</button>
    <div id="receivedMessage"></div>

    <script>
        // Android'e mesaj göndermek için fonksiyon
        function sendMessageToAndroid(message) {
            if (window.chrome && window.chrome.webview) {
                // Android'e mesaj gönder
                window.chrome.webview.postMessage(message);
            } else {
                console.log('Chrome Custom Tabs API not available');
            }
        }

        // Android'den gelen mesajları dinleme
        window.addEventListener('message', function(event) {
            console.log('Received message from Android:', event.data);
            document.getElementById('receivedMessage').textContent = 'Received: ' + event.data;
        });

        // Butona tıklandığında mesaj gönder
        document.getElementById('sendMessageBtn').addEventListener('click', function() {
            sendMessageToAndroid('Hello from Web Page!');
        });

        // Sayfa yüklendiğinde Android'e bildir
        window.addEventListener('load', function() {
            sendMessageToAndroid('Page Loaded');
        });
    </script>
</body>
</html>
