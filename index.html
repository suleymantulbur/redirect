<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Tabs Post Message</title>
</head>
<body>
    <h1>Post Message Example</h1>
    <button onclick="sendMessage()">Send Message</button>

    <script>
        function sendMessage() {
            // Android'deki Chrome Custom Tabs'e postMessage gönderir
            window.chrome.postMessage('Hello from the web page!', '*');
        }
    </script>
</body>
</html>
